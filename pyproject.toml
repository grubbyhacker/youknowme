[project]
name = "youknowme"
version = "0.1.0"
description = "YouKnowMe project workspace."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.28.0",
    "lancedb>=0.34.0",
    "markdown-it-py>=3.0.0",
    # The server imports the 1.x FastMCP module path. Keep the resolver from
    # selecting MCP 2.x until the service is deliberately migrated.
    "mcp[cli]>=2.0.0,<3.0.0",
    "numpy>=2.5.1",
    "pydantic>=2.11.0",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
ykm = "ykm.cli:main"
ykm-curator-dry-run = "ykm.curator_cli:main"
curator = "curator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ykm", "src/curator"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["POC"]
