[tools]
python = "3.12"
uv = "latest"

[tasks.sync]
description = "Install project dependencies with uv"
run = "uv sync"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Run lint checks"
run = "uv run ruff check ."

[tasks.demo]
description = "Build the synthetic corpus and run local CLI demo queries"
run = "scripts/local-demo.sh"

[tasks.eval]
description = "Build the synthetic corpus and run committed retrieval eval cases"
run = "rm -rf .ykm/eval-index && YKM_EMBEDDING_PROVIDER=fake uv run ykm build --corpus fixtures/corpus --out .ykm/eval-index >/dev/null && YKM_EMBEDDING_PROVIDER=fake uv run ykm eval --index .ykm/eval-index --cases fixtures/eval/synthetic.json"

[tasks.curator-model-eval]
description = "Run offline Curator model feedback-planning fixture evals"
run = "uv run pytest tests/test_curator_model_eval.py tests/test_curator_upload_model_eval.py -q"

[tasks.curator-feedback-model-live-eval]
description = "Run live Curator feedback-planning model scenario evals through a configured model proxy"
run = "uv run scripts/eval-curator-feedback-models.py"

[tasks.curator-upload-model-live-eval]
description = "Run live Curator upload-review model scenario evals through a configured model proxy"
run = "uv run scripts/eval-curator-upload-models.py"

[tasks.real-smoke]
description = "Build the private local corpus checkout into an ignored local index"
run = "scripts/real-corpus-smoke.sh"

[tasks.local-mcp-smoke]
description = "Run local MCP server smoke against an existing index"
run = "scripts/local-mcp-smoke.sh"

[tasks.container-smoke]
description = "Run containerized local MCP smoke against an existing index"
run = "scripts/container-smoke.sh"

[tasks.curator-dry-run]
description = "Run the local Curator dry-run harness against ignored local fixtures"
run = "rm -rf .ykm/curator-dry-run && mkdir -p .ykm/curator-dry-run/intake/uploads/pending .ykm/curator-dry-run/logs .ykm/curator-dry-run/output && env -u GITHUB_TOKEN -u GH_TOKEN -u OPENROUTER_API_KEY -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u YKM_GITHUB_PRIVATE_KEY_PATH -u YKM_CF_ACCESS_CLIENT_SECRET uv run ykm curator-dry-run --run-id local-curator-dry-run --intake .ykm/curator-dry-run/intake --logs .ykm/curator-dry-run/logs --output .ykm/curator-dry-run/output --no-task"
