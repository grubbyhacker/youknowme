[project]
name = "roger-knowledge-mcp"
version = "0.1.0"
description = "Phase 0 private MCP tunnel proof of concept for Roger's knowledge server."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]>=1.9.0",
    "pyjwt[crypto]>=2.8.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roger_knowledge_mcp"]
