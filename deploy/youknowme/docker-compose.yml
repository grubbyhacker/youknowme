services:
  youknowme:
    container_name: ${YKM_CONTAINER_NAME:-youknowme-phase1e}
    image: ${YKM_IMAGE:-youknowme:phase1e}
    restart: unless-stopped
    env_file:
      - ${YKM_ENV_FILE:-./runtime.env}
    volumes:
      - type: bind
        source: ${YKM_INDEX_MOUNT:-./data/index-current}
        target: /data/index
        read_only: true
      - type: bind
        source: ${YKM_LOG_DIR:-./data/logs}
        target: /data/logs
      - type: bind
        source: ${YKM_INTAKE_DIR:-./data/intake}
        target: /data/intake
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      roger-knowledge-private:
        aliases:
          - roger-knowledge-mcp
          - youknowme
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/livez', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    container_name: roger-knowledge-cloudflared-phase0
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "65532:65532"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TUNNEL_TOKEN:?CLOUDFLARED_TUNNEL_TOKEN is required}
    networks:
      - roger-knowledge-private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  roger-knowledge-private:
    external: true
