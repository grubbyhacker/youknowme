services:
  youknowme:
    container_name: ${YKM_CONTAINER_NAME:-youknowme-phase1e}
    image: ${YKM_IMAGE:-youknowme:phase1e}
    restart: unless-stopped
    env_file:
      - ${YKM_ENV_FILE:-/opt/youknowme/runtime.env}
    volumes:
      - type: bind
        source: ${YKM_INDEX_MOUNT:-/opt/youknowme/index-current}
        target: /data/index
        read_only: true
      - type: bind
        source: ${YKM_LOG_DIR:-/opt/youknowme/logs}
        target: /data/logs
      - type: bind
        source: ${YKM_INTAKE_DIR:-/opt/youknowme/intake}
        target: /data/intake
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      roger-knowledge-private:
        aliases:
          - roger-knowledge-mcp
          - youknowme
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/livez', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  roger-knowledge-private:
    external: true
